services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./keycloak/runtime/bsuir-realm.json:/opt/keycloak/data/import/bsuir-realm.json:ro
      - keycloak-db:/opt/keycloak/data/h2

volumes:
  keycloak-db:
